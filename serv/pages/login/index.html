<html>
  <head>
    <meta charset="utf-8" />
    <sliststyles />
  </head>
  <body>

    <div class="login">
      <h2 class="header">Sign in</h2>
      <form class="login-form" method="post" action="/login">
        <div class="login-fields">
          <label class="label" for="login">Login</label>
          <input id="login" name="login" type="text" placeholder="login..." required />
          <label class="label "for="password">Password</label>
          <input id="password" name="password" type="password" placeholder="password..." required />
        </div>
        <button class="button" type="submit">Sign In</button>
      </form>
    </div>

    <div class="register">
      <h2 class="header">Sign up</h2>
      <form class="register-form" method="post" action="/register">
        <div class="register-fields">
          <label class="label" for="register-login">Login</label>
          <input id="register-login" name="login" type="text" placeholder="login..." required />
          <label class="label "for="register-password">Password</label>
          <input id="register-password" name="password" type="password" placeholder="password..." required />
        </div>
        <button class="button" type="submit">Register</button>
      </form>
    </div>

    <slistscript />
  </body>
</html>
