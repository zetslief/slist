<div class="list-item">
    <input type="checkbox" class="-list-item-value-marker" id="slist-item-id" onclick="toggleItem(this)" checkedvalue/>
    <label for="slist-item-id" class="-list-item-title-marker"><slistitemlabel /></label>
    <div class="actions">
        <button class="action" onclick="copyItem(this)">️📋</button>
        <button class="action" onclick="deleteItem(this)">🗑️</button>
    </div>
</div>
