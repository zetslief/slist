<div class="list-item">
    <input type="checkbox" class="-list-item-value-marker" id="slist-item-id" onclick="toggleItem(this)" checkedvalue/>
    <div class="readonly-label">
        <label for="slist-item-id" class="-list-item-title-marker"><slistitemlabel /></label>
        <div class="actions">
            <button class="action" onclick="copyItem(this)">️📋</button>
            <button class="action" onclick="startRenameItem(this)">️✏️</button>
            <button class="action" onclick="deleteItem(this)">🗑️</button>
        </div>
    </div>
    <div class="edit-label">
        <input class="-list-item-rename-value-marker" name="item-rename-input" type="text" minlength="1" required />
        <button onclick="acceptRenameItem(this)">✅</button>
        <button>❌</button>
    </div>
</div>
