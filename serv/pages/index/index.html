<html>
  <head>
    <meta charset="utf-8" />
    <sliststyles />
  </head>
  <body>
    <div class="header">
      <h1>Hello, Slist!</h1>
      <button class="add-new-button"
        commandfor="new-list-dialog" command="show-modal">➕New list</button>
    </div>
    <div class="list-container">
      <div class="list-item">
        <h3 class="list-title">Groceries</h3>
        <div>
          <input type="checkbox" id="fruits"/>
          <label for="fruits">Fruits</label>
        </div>
        <div>
          <input type="checkbox" id="veggies"/>
          <label for="veggies">Veggies</label>
        </div>
        <div>
          <input type="checkbox" id="else"/>
          <label for="else">Else</label>
        </div>
      </div>

      <div class="list-item">
        <h3 class="list-title">Car</h3>
        <div>
          <input type="checkbox" id="tires"/>
          <label for="tires">Tires</label>
        </div>
        <div>
          <input type="checkbox" id="window"/>
          <label for="window">Window</label>
        </div>
        <div>
          <input type="checkbox" id="breaks"/>
          <label for="breaks">Breaks</label>
        </div>
      </div>
    </div>

    <dialog id="new-list-dialog">
      <div class="new-list-dialog">
        <h3 class="title">Add new list</h3>
        <div>
          <label for="new-list-name">Title:</label>
          <input id="new-list-name" placeholder="type new list name...." />
        </div>
        <div class="button-bar">
          <button class="submit" commandfor="new-list-dialog" command="close">Save</button>
          <button class="cancel" commandfor="new-list-dialog" command="close">Cancel</button>
        </div>
      </div>
    </dialog>

    <slistscript />
  </body>
</html>
