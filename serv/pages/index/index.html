<html>
  <head>
    <meta charset="utf-8" />
    <sliststyles />
  </head>
  <body>
    <div class="header">
      <h1>Hello, Slist!</h1>
      <button class="add-new-button"
        commandfor="new-list-dialog" command="show-modal">➕New list</button>
    </div>
    <div class="list-container">
      <div class="list-item">
        <h3 class="list-title">Groceries</h3>
        <div>
          <input type="checkbox" name="fruits"/>
          <label for="fruits">Fruits</label>
        </div>
        <div>
          <input type="checkbox" name="veggies"/>
          <label for="veggies">Veggies</label>
        </div>
        <div>
          <input type="checkbox" name="else"/>
          <label for="else">Else</label>
        </div>
      </div>

      <div class="list-item">
        <h3 class="list-title">Car</h3>
        <div>
          <input type="checkbox" name="tires"/>
          <label for="tires">Tires</label>
        </div>
        <div>
          <input type="checkbox" name="window"/>
          <label for="window">Window</label>
        </div>
        <div>
          <input type="checkbox" name="breaks"/>
          <label for="breaks">Breaks</label>
        </div>
      </div>
    </div>

    <dialog id="new-list-dialog">
      <div>
        <h1>Hello!</h1>
        <button commandfor="new-list-dialog" command="close">Close</button>
      </div>
    </dialog>
    <slistscript />
  </body>
</html>
