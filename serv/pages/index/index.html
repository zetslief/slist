<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <sliststyles />
  </head>
  <body>
    <div class="header">
      <h1>Hello, Slist!</h1>
      <button class="add-new-button"
        commandfor="new-list-dialog" command="show-modal">➕New list</button>
    </div>
    <div class="list-container">
      <slistlists />
    </div>

    <dialog id="new-list-dialog">
      <div class="new-list-dialog">
        <h3 class="title">Add new list</h3>
        <div>
          <label for="new-list-name">Title:</label>
          <input id="new-list-name" placeholder="type new list name...." />
        </div>
        <div class="button-bar">
          <button class="submit" commandfor="new-list-dialog" command="close" onclick="createList()">Save</button>
          <button class="cancel" commandfor="new-list-dialog" command="close">Cancel</button>
        </div>
      </div>
    </dialog>

    <slistscript />
  </body>
</html>
