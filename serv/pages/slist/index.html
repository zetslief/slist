<div class="list" id="slist-id">
    <div class="header">
        <h3 class="title -title-marker"><slisttitle /></h3>
        <button class="copy-button" onclick="copyListToClipboard(this)">📋</button>
    </div>
    <div class="list-items">
        <slistitems />
    </div>
    <div class="footer">
        <input class="-new-item-marker" name="new-item-input" type="text" placeholder="add new item..." />
        <button onclick="addNewItem(this)">Add</button>
    </div>

    <template id="list-item-template">
        <slistitemtemplate />
    </template>
</div>
